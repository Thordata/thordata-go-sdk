name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Go fmt check
        run: |
          test -z "$(gofmt -l .)"

      - name: Go test
        run: |
          go test ./...
          
      - name: Go test (race)
        run: |
          go test -race ./...